# Password of the Argo CD admin account: a bcrypt hash, generated by scripts/platform-up.sh (see .tools/admin.env).
# Values are base64, as in any Secret. admin.passwordMtime is managed by the platform and must not be set.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  labels:
    app.kubernetes.io/name: argocd-secret
    app.kubernetes.io/part-of: argocd
type: Opaque
data:
  admin.password: @@ADMIN_PASSWORD_HASH_B64@@
