# Password of the Kargo admin account: a bcrypt hash, generated by scripts/platform-up.sh (see .tools/admin.env).
# Values are base64, as in any Secret: the platform rejects a plain hash ("illegal base64 data").
apiVersion: v1
kind: Secret
metadata:
  name: kargo-secret
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: kargo
    app.kubernetes.io/name: kargo
type: Opaque
data:
  adminAccountPasswordHash: @@ADMIN_PASSWORD_HASH_B64@@
