# Password of the Kargo admin account: a bcrypt hash, generated by scripts/platform-up.sh (see .tools/admin.env).
# Unlike the Argo CD secret, the value is the plain bcrypt hash, as in the platform's own example (a base64 value
# was accepted but stored as the hash itself, so the password never matched).
apiVersion: v1
kind: Secret
metadata:
  name: kargo-secret
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: kargo
    app.kubernetes.io/name: kargo
type: Opaque
data:
  adminAccountPasswordHash: "@@ADMIN_PASSWORD_HASH@@"
