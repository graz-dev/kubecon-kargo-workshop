# What Kargo pushes to Gitea with: the kargo-bot user and its token (Secret values are base64).
apiVersion: v1
kind: Secret
metadata:
  name: gitea-credentials
  namespace: @@KARGO_PROJECT@@
  labels:
    kargo.akuity.io/cred-type: git
type: Opaque
data:
  repoURL: @@B64_REPO_URL@@
  username: @@B64_USERNAME@@
  password: @@B64_PASSWORD@@
