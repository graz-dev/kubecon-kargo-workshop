apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: @@KARGO_PROJECT@@
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: app
      sources:
        stages:
          - staging
  promotionTemplate:
    spec:
      vars:
        - name: repoURL
          value: @@GITEA_REPO_URL@@
        - name: image
          value: @@CLUSTER_IMAGE_REPO@@
      steps:
        - uses: get-user-input
          as: reason
          config:
            display: Why does this version go to production?
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  title: Reason
        - uses: wait-for-approval
          as: approve
          config:
            minApprovals: 1
        - uses: git-clone
          config:
            repoURL: ${{ vars.repoURL }}
            author:
              name: kargo-bot
              email: kargo-bot@workshop.local
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/env/prod-amer-east/k8s/values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom(vars.image).Tag }}
        - uses: yaml-update
          config:
            path: ./repo/env/prod-amer-west/k8s/values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom(vars.image).Tag }}
        - uses: yaml-update
          config:
            path: ./repo/env/prod-emea/k8s/values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom(vars.image).Tag }}
        - uses: git-commit
          config:
            path: ./repo
            message: Promote ${{ imageFrom(vars.image).Tag }} to production (all regions)
        - uses: git-push
          config:
            path: ./repo
        - uses: record-audit-event
          as: audit
          retry:
            errorThreshold: 3
          config:
            type: approved
            message: "Release ${{ imageFrom(vars.image).Tag }} to ${{ ctx.stage }} approved by ${{ outputs.approve.responses[0].user }}."
            actor: ${{ outputs.approve.responses[0].user }}
            data:
              reason: ${{ outputs.reason.values.reason }}
