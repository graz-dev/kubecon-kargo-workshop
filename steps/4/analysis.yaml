apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: smoke-test
  namespace: @@KARGO_PROJECT@@
spec:
  args:
    - name: stage
  metrics:
    - name: smoke-test
      provider:
        job:
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 600
            activeDeadlineSeconds: 90
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: check
                    image: @@CURL_IMAGE@@
                    env:
                      - name: BASE
                        value: "http://guestbook.guestbook-{{args.stage}}.svc.cluster.local"
                      - name: MARKER
                        value: "Kargo Guestbook"
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -eu
                        echo "Smoke testing guestbook at $BASE"
                        for i in $(seq 1 20); do
                          if curl -fsS -o /tmp/index "$BASE/"; then break; fi
                          echo "  attempt $i: not ready, retrying..."; sleep 2
                        done
                        grep -q "$MARKER" /tmp/index || { echo "FAIL: guestbook home page not served"; exit 1; }
                        echo "PASS: guestbook is up"
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: e2e-test
  namespace: @@KARGO_PROJECT@@
spec:
  args:
    - name: stage
  metrics:
    - name: e2e-test
      provider:
        job:
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 600
            activeDeadlineSeconds: 90
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: check
                    image: @@CURL_IMAGE@@
                    env:
                      - name: BASE
                        value: "http://guestbook.guestbook-{{args.stage}}.svc.cluster.local"
                      - name: MARKER
                        value: "Kargo Guestbook"
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -eu
                        echo "E2E testing guestbook at $BASE"
                        for i in $(seq 1 20); do
                          if curl -fsS -o /tmp/index "$BASE/"; then break; fi
                          echo "  attempt $i: not ready, retrying..."; sleep 2
                        done
                        grep -q "$MARKER" /tmp/index || { echo "FAIL: guestbook home page not served"; exit 1; }
                        grep -q 'id="entry-form"' /tmp/index || { echo "FAIL: guestbook form missing"; exit 1; }
                        echo "PASS: guestbook is up and interactive"
