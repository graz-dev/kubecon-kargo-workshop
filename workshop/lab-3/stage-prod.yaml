# The prod Stage: the gate before production. One decision here sends the release to all three regions.
# Replace every TODO. Everything else is ready.
# There is no argocd-update here: prod only writes to Git. The regions have their own Stages (next file).
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: guestbook
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: app
      sources:
        stages:
          - TODO    # the name of the Stage that comes before prod
  promotionTemplate:
    spec:
      vars:
        # Port 80 is assumed. If you use another port in workshop.env, add it here: gitea.localtest.me:8080
        - name: repoURL
          value: http://gitea.localtest.me/workshop/guestbook-gitops
        - name: image
          value: ghcr.io/graz-dev/kargo-workshop-guestbook
      steps:
        # 1. Get the GitOps repository
        - uses: git-clone
          config:
            repoURL: ${{ vars.repoURL }}
            author:
              name: kargo-bot
              email: kargo-bot@workshop.local
            checkout:
              - branch: main
                path: ./repo
        # 2. Change the image tag in the values file of every region
        - uses: yaml-update
          config:
            path: ./repo/env/prod-amer-east/k8s/values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom(vars.image).Tag }}
        - uses: yaml-update
          config:
            path: ./repo/env/prod-amer-west/k8s/values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom(vars.image).Tag }}
        - uses: yaml-update
          config:
            path: TODO    # the values file of the third region
            updates:
              - key: image.tag
                value: ${{ imageFrom(vars.image).Tag }}
        # 3. One commit for all three regions
        - uses: git-commit
          config:
            path: ./repo
            message: Promote ${{ imageFrom(vars.image).Tag }} to production (all regions)
        # 4. Push it
        - uses: git-push
          config:
            path: ./repo
