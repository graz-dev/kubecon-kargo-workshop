kind: ProjectConfig
metadata:
  name: guestbook
  namespace: guestbook
spec:
  promotionPolicies:
    - stageSelector:
        name: dev
      autoPromotionEnabled: true
      # What to do when something goes wrong in this Stage
      autoRollback:
        onVerification:
          - TODO    # the result of a check that should trigger the rollback: Failed or Error
    - stageSelector:
        name: "glob:prod-*"
      autoPromotionEnabled: true
